name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Launcher icon (images/icon-512.png)
        run: |
          if [ -f images/icon-512.png ]; then
            cp images/icon-512.png app/src/main/res/drawable-nodpi/ic_launcher_image.png
          else
            echo "images/icon-512.png nahi mila - default icon use hoga"
          fi
          ls images 2>/dev/null | head -50 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CommerceHub11.apk

      # Direct .apk download (zip nahi): repo -> Releases
      - name: Publish APK to Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: CommerceHub11.apk
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Upload APK (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: CommerceHub11-debug-apk
          path: CommerceHub11.apk
          if-no-files-found: error
